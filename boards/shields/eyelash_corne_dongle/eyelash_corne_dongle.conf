# The dongle has no physical LEDs: the RGB underglow behavior is GLOBAL and
# runs on the central side, tracked here through the virtual strip (chain-length
# 0) and propagated to the peripheral halves over the split transport.
#
# ZMK_RGB_UNDERGLOW_EXT_POWER is `default y` in Kconfig.defaults, but it pulls
# in a required `zmk,ext-power-generic` device tree node. nice!nano defines
# that node; the Seeed XIAO BLE does not. The dongle controls no external power
# rail, so disable the feature instead of fabricating a fake EXT_POWER node.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
