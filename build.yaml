---
include:
  # Left half — now a split peripheral (central role lives in the dongle)
  - board: eyelash_corne_left
    shield: nice_view
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: eyelash_corne_left
  # Right half — split peripheral
  - board: eyelash_corne_right
    shield: nice_view
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: eyelash_corne_right
  # Dongle — split central connected to the PC over USB; ZMK Studio runs here
  - board: nice_nano_v2
    shield: eyelash_corne_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n -DCONFIG_BT_MAX_CONN=7 -DCONFIG_BT_MAX_PAIRED=7 -DCONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2 -DCONFIG_ZMK_RGB_UNDERGLOW=n -DCONFIG_ZMK_BACKLIGHT=n
    artifact-name: eyelash_corne_dongle
  # Settings reset for the dongle's nice!nano
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: settings_reset_nice_nano
  # Settings reset for the keyboard halves (eyelash_corne board)
  - board: eyelash_corne_left
    shield: settings_reset
    artifact-name: settings_reset_eyelash_corne
